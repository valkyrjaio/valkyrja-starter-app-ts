name: CI

on:
  push:
    branches: [ 'master', '*.x' ]
  pull_request:
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:
  commit-message-check:
    name: Commit Message Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_commit-message-check.yml@983fb2adea0987861f9ec402e6e7a13638119f2c
    secrets: inherit

  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@983fb2adea0987861f9ec402e6e7a13638119f2c
    permissions:
      pull-requests: write
      contents: read
    secrets: inherit

  typescript:
    name: TypeScript
    uses: valkyrjaio/.github/.github/workflows/_ts-typescript.yml@983fb2adea0987861f9ec402e6e7a13638119f2c
    with:
      ci-directory: .github/ci/typescript
      paths: |
        ci:
          - '.github/ci/typescript/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/typescript/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.ts'
          - 'bin/**/*.ts'
          - 'tsconfig.json'
          - 'package.json'
          - 'package-lock.json'
    secrets: inherit

  eslint:
    name: ESLint
    uses: valkyrjaio/.github/.github/workflows/_ts-eslint.yml@983fb2adea0987861f9ec402e6e7a13638119f2c
    with:
      ci-directory: .github/ci/eslint
      additional-directory: .github/ci/typescript
      paths: |
        ci:
          - '.github/ci/typescript/**'
          - '.github/ci/eslint/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/typescript/**'
          - '.github/ci/eslint/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.ts'
          - 'bin/**/*.ts'
          - 'tsconfig.json'
          - 'package.json'
          - 'package-lock.json'
    secrets: inherit

  prettier:
    name: Prettier
    uses: valkyrjaio/.github/.github/workflows/_ts-prettier.yml@983fb2adea0987861f9ec402e6e7a13638119f2c
    with:
      ci-directory: .github/ci/prettier
      paths: |
        ci:
          - '.github/ci/prettier/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/prettier/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.ts'
          - 'bin/**/*.ts'
          - '*.json'
          - '*.md'
    secrets: inherit

  vitest:
    name: Vitest
    uses: valkyrjaio/.github/.github/workflows/_ts-vitest.yml@983fb2adea0987861f9ec402e6e7a13638119f2c
    with:
      ci-directory: .github/ci/vitest
      paths: |
        ci:
          - '.github/ci/vitest/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/vitest/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.ts'
          - 'tests/**/*.ts'
          - 'bin/**/*.ts'
          - 'package.json'
          - 'package-lock.json'
    secrets: inherit

  # Unlike `vitest` (which seeds the empty `*.example.ts` stubs via the root
  # postinstall and asserts the stub classes), this job runs Sindri to generate
  # the REAL App*Data classes into the source tree and tests the application as
  # it actually runs in production — a separate, isolated environment so stubbed
  # and generated results never mingle, and a way to exercise Sindri against a
  # real application before a release. It cannot reuse `_ts-vitest.yml`: that
  # workflow has no step to run the generator, so the job is defined inline here
  # (no shared/reusable workflow is modified).
  sindri-vitest:
    name: Sindri Vitest

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/ci/sindri-vitest/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Generate the data caches with Sindri
        run: npm run sindri

      - name: Install CI dependencies
        working-directory: .github/ci/sindri-vitest
        run: npm ci

      - name: Run Sindri Vitest
        working-directory: .github/ci/sindri-vitest
        run: npm run check
