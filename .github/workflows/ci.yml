name: CI

on:
  push:
    branches: [ 'master', '*.x' ]

  pull_request:
    # `edited` is included so a pull request that GitHub auto-retargets — which happens to a stacked
    # pull request the moment its parent merges — re-runs its checks against the new base. A
    # base-branch change has no activity type of its own; GitHub reports it as `edited`, and `edited`
    # is not one of the default types, so such a pull request otherwise sits with no checks at all.
    #
    # `edited` also fires for title and description edits, so the whole suite re-runs for those too.
    # That cost is accepted deliberately. Skipping the jobs instead — via a `changes.base` guard —
    # does not work: a skipped caller job never produces the `<job> / <job>` context the required
    # status checks are waiting for, and GitHub evaluates requirements against the latest run, so an
    # earlier run's success does not carry over. The pull request ends up blocked on
    # "Expected — Waiting for status to be reported" until someone pushes a commit.
    types: [ opened, synchronize, reopened, edited ]
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:

  commit-message-check:
    name: Commit Message Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_commit-message-check.yml@19ed6d81f20f621a2ea4ef6318d9fe5c0187fbb8
    secrets: inherit

  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@19ed6d81f20f621a2ea4ef6318d9fe5c0187fbb8
    permissions:
      pull-requests: write
      contents: read
    secrets: inherit

  sindri-vitest:
    name: Sindri Vitest

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/ci/sindri-vitest/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Generate the data caches with Sindri
        run: npm run sindri

      - name: Install CI dependencies
        working-directory: .github/ci/sindri-vitest
        run: npm ci

      - name: Run Sindri Vitest
        working-directory: .github/ci/sindri-vitest
        run: npm run check

  # A check's name is built from every job name down the call chain, so this composes
  # as `CI / Tools / <Tool> / …`.
  tools:
    name: Tools
    uses: valkyrjaio/.github/.github/workflows/_ts-ci-tools.yml@19ed6d81f20f621a2ea4ef6318d9fe5c0187fbb8
    with:
      eslint-additional-directory: '.github/ci/typescript'
      source-paths: |
        src/**/*.ts
        bin/**/*.ts
        tsconfig.json
        package.json
        package-lock.json
        *.json
        *.md
        tests/**/*.ts
    secrets: inherit
