name: CI

on:
  push:
    branches: [ 'master', '*.x' ]
  pull_request:
    # `edited` is included so a pull request that GitHub auto-retargets — which happens to a stacked
    # pull request the moment its parent merges — re-runs its checks. A base-branch change has no
    # activity type of its own; GitHub reports it as `edited` with a `changes.base` payload, and
    # `edited` is not one of the default types, so such a pull request otherwise sits with no checks
    # at all. `edited` also fires for title and description edits, so the tool jobs below additionally
    # require `changes.base` rather than replaying a whole matrix for a reworded description.
    types: [ opened, synchronize, reopened, edited ]
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:
  commit-message-check:
    name: Commit Message Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_commit-message-check.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    secrets: inherit

  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    permissions:
      pull-requests: write
      contents: read
    secrets: inherit

  typescript:
    name: TypeScript
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_ts-typescript.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/typescript
      paths: |
        ci:
          - '.github/ci/typescript/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/typescript/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.ts'
          - 'bin/**/*.ts'
          - 'tsconfig.json'
          - 'package.json'
          - 'package-lock.json'
    secrets: inherit

  eslint:
    name: ESLint
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_ts-eslint.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/eslint
      additional-directory: .github/ci/typescript
      paths: |
        ci:
          - '.github/ci/typescript/**'
          - '.github/ci/eslint/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/typescript/**'
          - '.github/ci/eslint/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.ts'
          - 'bin/**/*.ts'
          - 'tsconfig.json'
          - 'package.json'
          - 'package-lock.json'
    secrets: inherit

  prettier:
    name: Prettier
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_ts-prettier.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/prettier
      paths: |
        ci:
          - '.github/ci/prettier/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/prettier/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.ts'
          - 'bin/**/*.ts'
          - '*.json'
          - '*.md'
    secrets: inherit

  vitest:
    name: Vitest
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_ts-vitest.yml@e3e801bdc0d696988d6fc331b6cf0d806b653abd
    with:
      ci-directory: .github/ci/vitest
      paths: |
        ci:
          - '.github/ci/vitest/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/vitest/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.ts'
          - 'tests/**/*.ts'
          - 'bin/**/*.ts'
          - 'package.json'
          - 'package-lock.json'
    secrets: inherit

  # Unlike `vitest` (which seeds the empty `*.example.ts` stubs via the root
  # postinstall and asserts the stub classes), this job runs Sindri to generate
  # the REAL App*Data classes into the source tree and tests the application as
  # it actually runs in production — a separate, isolated environment so stubbed
  # and generated results never mingle, and a way to exercise Sindri against a
  # real application before a release. It cannot reuse `_ts-vitest.yml`: that
  # workflow has no step to run the generator, so the job is defined inline here
  # (no shared/reusable workflow is modified).
  sindri-vitest:
    name: Sindri Vitest
    if: github.event.action != 'edited' || github.event.changes.base

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/ci/sindri-vitest/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Generate the data caches with Sindri
        run: npm run sindri

      - name: Install CI dependencies
        working-directory: .github/ci/sindri-vitest
        run: npm ci

      - name: Run Sindri Vitest
        working-directory: .github/ci/sindri-vitest
        run: npm run check
