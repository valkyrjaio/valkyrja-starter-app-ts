name: CI

on:
  push:
    branches: [ 'master', '*.x' ]

  pull_request:
    # `edited` is deliberately absent. It fires for a title or description edit, and this workflow
    # checks file content, which an edit cannot change. Running it on an edit would cost the full
    # tool suite for a typo. Guarding the jobs on `github.event.changes` instead does not work and
    # is not safe: a caller job skipped by `if:` never produces the `<job> / <job>` context the
    # required status checks wait for, so the pull request blocks; and a guard inside the job would
    # report success without running the tools, so an edit on a red pull request would turn it
    # green. Pull request metadata is checked by `pr.yml`, which does subscribe to `edited`.
    types: [ opened, synchronize, reopened ]
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:


  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@fbf1e4db594578f8ea0c95ac8561cecb3c7a96c2
    permissions:
      pull-requests: write
      contents: read
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  markdown-check:
    name: Markdown Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_markdown-check.yml@fbf1e4db594578f8ea0c95ac8561cecb3c7a96c2
    permissions:
      pull-requests: write
      contents: read
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  sindri-vitest:
    name: Sindri Vitest

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/ci/sindri-vitest/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Generate the data caches with Sindri
        run: npm run sindri

      - name: Install CI dependencies
        working-directory: .github/ci/sindri-vitest
        run: npm ci

      - name: Run Sindri Vitest
        working-directory: .github/ci/sindri-vitest
        run: npm run check

  # ESLint holds a TypeScript file to the copyright header through the local `copyright-header`
  # rule, and it runs over the source and the test trees only. A build configuration file and a
  # file of any other type have no mechanism that reads the header.
  # This job is closed by default instead: it requires the header in every tracked file that
  # `EXCLUDED` does not match, so a file of a type no tool reads cannot pass in silence.
  # `.github/ci/copyright-header/config` holds that list. The job stands outside the `source-paths`
  # filter that the `tools` job derives, because a filter that misses a path skips the job, and a
  # skipped job reads the same as a clean run.
  copyright-header-check:
    name: Copyright Header Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_copyright-header-check.yml@fbf1e4db594578f8ea0c95ac8561cecb3c7a96c2
    permissions:
      pull-requests: write
      contents: read
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  # A check's name is built from every job name down the call chain, so this composes
  # as `CI / Tools / <Tool> / …`.
  tools:
    name: Tools
    uses: valkyrjaio/.github/.github/workflows/_ts-ci-tools.yml@fbf1e4db594578f8ea0c95ac8561cecb3c7a96c2
    with:
      eslint-additional-directory: '.github/ci/typescript'
      source-paths: |
        src/**/*.ts
        bin/**/*.ts
        tsconfig.json
        package.json
        package-lock.json
        *.json
        *.md
        tests/**/*.ts
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
